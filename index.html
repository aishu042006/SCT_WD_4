<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Organize your tasks and stay productive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-wrapper">
        <div class="app-card">
            <!-- Top Header & Compact Focus Timer -->
            <header class="top-header-section">
                <div class="header-brand">
                    <h1 class="app-title">TaskFlow</h1>
                    <p class="app-subtitle">Organize your tasks and stay productive</p>
                </div>

                <!-- Compact Focus Timer at Top -->
                <div class="compact-timer">
                    <div class="timer-meta">
                        <span class="timer-label">Focus Timer</span>
                        <span class="timer-display" id="timerDisplay">25:00</span>
                    </div>
                    <div class="timer-controls">
                        <button type="button" class="btn btn-sage btn-sm" id="startTimerBtn">Start</button>
                        <button type="button" class="btn btn-secondary btn-sm" id="pauseTimerBtn" style="display: none;">Pause</button>
                        <button type="button" class="btn btn-outline btn-sm" id="resetTimerBtn">Reset</button>
                    </div>
                    <div class="timer-status" id="timerStatus" style="display: none;">Ready to focus?</div>
                </div>
            </header>

            <!-- Add Task Section -->
            <section class="add-task-section">
                <form id="addTaskForm" novalidate>
                    <div class="input-group-title">
                        <input type="text" id="taskTitleInput" placeholder="What do you need to do?" aria-label="What do you need to do?">
                    </div>
                    <div class="input-group-meta">
                        <input type="date" id="taskDateInput" aria-label="Task date">
                        <input type="time" id="taskTimeInput" aria-label="Task time">
                        <button type="submit" class="btn btn-sage" id="addTaskBtn">Add Task</button>
                    </div>
                </form>
                <div class="validation-msg" id="validationMsg" style="display: none;">
                    Please enter task title, date, and time.
                </div>
            </section>

            <!-- Task Statistics & Filters -->
            <section class="toolbar-section">
                <div class="task-stats">
                    <span class="stat-item">Total Tasks: <strong id="totalCount">0</strong></span>
                    <span class="stat-divider">•</span>
                    <span class="stat-item">Completed: <strong id="completedCount">0</strong></span>
                </div>

                <div class="filter-pills" role="tablist">
                    <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
                    <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
                    <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
                </div>
            </section>

            <!-- Task List Section -->
            <section class="task-list-section">
                <div id="taskListContainer" class="task-list">
                    <!-- Rendered tasks or Empty state -->
                </div>
            </section>
        </div>
    </main>

    <!-- EDIT TASK MODAL -->
    <div class="modal-backdrop" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="editModalTitle">Edit Task</h3>
                <button type="button" class="modal-close-btn" id="closeEditModalBtn" aria-label="Close modal">&times;</button>
            </div>
            <form id="editTaskForm" novalidate>
                <div class="form-field">
                    <label for="editTitleInput" class="form-label">Task Title</label>
                    <input type="text" id="editTitleInput" class="form-input" required>
                </div>
                <div class="form-row">
                    <div class="form-field col-6">
                        <label for="editDateInput" class="form-label">Date</label>
                        <input type="date" id="editDateInput" class="form-input" required>
                    </div>
                    <div class="form-field col-6">
                        <label for="editTimeInput" class="form-label">Time</label>
                        <input type="time" id="editTimeInput" class="form-input" required>
                    </div>
                </div>
                <div class="validation-msg" id="editValidationMsg" style="display: none;">
                    Please fill out all fields.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn btn-sage" id="saveEditBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DELETE CONFIRMATION MODAL -->
    <div class="modal-backdrop" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
        <div class="modal-card modal-small">
            <div class="modal-header">
                <h3 class="modal-title" id="deleteModalTitle">Delete Task</h3>
                <button type="button" class="modal-close-btn" id="closeDeleteModalBtn" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="confirm-text">Delete this task?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="btn btn-coral" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
